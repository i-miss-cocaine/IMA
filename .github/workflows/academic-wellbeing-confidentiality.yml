name: Academic Wellbeing Confidentiality Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/academic-service/Code.gs
      - tests/security/academic-wellbeing-confidentiality.test.js
      - .github/workflows/academic-wellbeing-confidentiality.yml
      - .github/workflows/exam-service-security-contract.yml
      - .github/workflows/accounting-transport-local-contract.yml
      - Auditoría/AUDITORIA-FASE-11-COMUNICACION-BIENESTAR-SUPERVISION-FINANZAS.md
      - Auditoría/AUDITORIA_FASE_21_TRANSPORTE_SERVICIOS_COMPLEMENTARIOS.md
      - Auditoría/PLAN_MAESTRO_IMPLEMENTACION.md
      - Auditoría/INDICE_CHECKPOINTS.md
      - Auditoría/Contexto_personal_Historico/Checkpoints_Parte_0021.txt
      - pendientes/Secretaria/Pendientes.md
      - Auditoria.txt
      - beta_test.txt
      - changueslogs.txt
      - tareas_auditoria.txt
      - pendientes/README.md
      - pendientes/Otros/Pendientes.md
      - pendientes/Padre/Pendientes.md
      - pendientes/Estudiante/Pendientes.md
      - pendientes/Docente/Pendientes.md
      - pendientes/Contabilidad/Pendientes.md
      - pendientes/Dirección/Pendientes.md
      - Auditoría/Contexto_personal_Historico/Checkpoints_Parte_0022.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check task diff integrity
        shell: bash
        run: |
          git diff --check 2b147767573955113416e661867cb74e85f1e96d...HEAD
          changed="$(git -c core.quotePath=false diff --name-only 2b147767573955113416e661867cb74e85f1e96d...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              backend/academic-service/Code.gs|tests/security/academic-wellbeing-confidentiality.test.js|.github/workflows/academic-wellbeing-confidentiality.yml|.github/workflows/exam-service-security-contract.yml|.github/workflows/accounting-transport-local-contract.yml|Auditoría/AUDITORIA-FASE-11-COMUNICACION-BIENESTAR-SUPERVISION-FINANZAS.md|Auditoría/AUDITORIA_FASE_21_TRANSPORTE_SERVICIOS_COMPLEMENTARIOS.md|Auditoría/PLAN_MAESTRO_IMPLEMENTACION.md|Auditoría/INDICE_CHECKPOINTS.md|Auditoría/Contexto_personal_Historico/Checkpoints_Parte_0021.txt|pendientes/Secretaria/Pendientes.md|Auditoria.txt|beta_test.txt|changueslogs.txt|tareas_auditoria.txt|Auditoría/Contexto_personal_Historico/Checkpoints_Parte_0022.txt|pendientes/Dirección/Pendientes.md|pendientes/Contabilidad/Pendientes.md|pendientes/Docente/Pendientes.md|pendientes/Estudiante/Pendientes.md|pendientes/Padre/Pendientes.md|pendientes/Otros/Pendientes.md|pendientes/README.md|backend/developer-service/Code.gs|tests/security/developer-service-registry.test.js|developer-dashboard.html|js/developer.js|.github/workflows/developer-service-registry-contract.yml) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check Apps Script service
        run: node --check < backend/academic-service/Code.gs
      - name: Syntax check contract test
        run: node --check tests/security/academic-wellbeing-confidentiality.test.js
      - name: Execute confidentiality contract
        run: node tests/security/academic-wellbeing-confidentiality.test.js
