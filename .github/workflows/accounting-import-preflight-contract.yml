name: Accounting Import Preflight Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/accounting-service/Code.gs
      - backend/user-service/Code.gs
      - backend/academic-service/Code.gs
      - tests/security/accounting-remote-target-snapshot.test.js
      - tests/security/academic-pdf-ocr-contract.test.js
      - tests/security/academic-pdf-page-classifier.test.js
      - tests/security/openxml-package-validation.test.js
      - tests/security/file-binary-validation-contract.test.js
      - tests/security/accounting-import-auth-router.test.js
      - tests/security/accounting-migration-writer.test.js
      - tests/security/accounting-import-file-envelope.test.js
      - tests/security/accounting-import-semantic-preflight.test.js
      - tests/security/accounting-departmental-import-scope.test.js
      - js/accounting.js
      - dashboard-contabilidad.html
      - tests/security/accounting-migration-import-ui.test.js
      - tests/security/accounting-employee-expediente-scope.test.js
      - tests/security/identity-mapping-contract.test.js
      - tests/security/accounting-identity-map-snapshot.test.js
      - tests/security/academic-migration-writer.test.js
      - js/teacher.js
      - teacher-dashboard.html
      - tests/security/teacher-excel-semantic-preflight-ui.test.js
      - .github/workflows/accounting-import-preflight-contract.yml

permissions:
  contents: read

jobs:
  accounting-import-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
        with:
          ref: NG_beta_0.0.0.1_work
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check ACCOUNTING service syntax
        run: node --check < backend/accounting-service/Code.gs
      - name: Check USER service syntax
        run: node --check < backend/user-service/Code.gs
      - name: Check ACADEMIC service syntax
        run: node --check < backend/academic-service/Code.gs
      - name: Run signed import authorization and HTTP router contract
        run: node tests/security/accounting-import-auth-router.test.js
      - name: Run journaled accounting migration writer contract
        run: node tests/security/accounting-migration-writer.test.js
      - name: Run uploaded XLSX binary envelope contract
        run: node tests/security/accounting-import-file-envelope.test.js
      - name: Run USER and ACADEMIC remote target snapshot contract
        run: node tests/security/accounting-remote-target-snapshot.test.js
      - name: Run Academic PDF OCR contract
        run: node tests/security/academic-pdf-ocr-contract.test.js
      - name: Run Academic PDF page classifier contract
        run: node tests/security/academic-pdf-page-classifier.test.js
      - name: Run cross-service file binary validation contract
        run: node tests/security/file-binary-validation-contract.test.js
      - name: Run cross-service OpenXML package contract
        run: node tests/security/openxml-package-validation.test.js
      - name: Run semantic import preflight contract
        run: node tests/security/accounting-import-semantic-preflight.test.js
      - name: Run departmental import scope contract
        run: node tests/security/accounting-departmental-import-scope.test.js
      - name: Run versioned API response and HTTP contract
        run: node tests/contracts/api-response-contract.test.js
      - name: Run USER session-token transport contract
        run: node tests/security/session-token-transport.test.js
      - name: Run USER department-reference HMAC envelope contract
        run: node tests/security/department-reference-interservice-envelope.test.js
      - name: Check API client syntax
        run: node --check js/api.js
      - name: Check accounting dashboard syntax
        run: node --check js/accounting.js
      - name: Run accounting migration import UI contract
        run: node tests/security/accounting-migration-import-ui.test.js
      - name: Run employee expediente scope contract
        run: node tests/security/accounting-employee-expediente-scope.test.js
      - name: Run identity mapping regression contract
        run: node tests/security/identity-mapping-contract.test.js
      - name: Run trusted USER identity snapshot contract
        run: node tests/security/accounting-identity-map-snapshot.test.js
      - name: Run Academic student migration writer contract
        run: node tests/security/academic-migration-writer.test.js
      - name: Check teacher dashboard controller syntax
        run: node --check js/teacher.js
      - name: Run Excel semantic preflight UI contract
        run: node tests/security/teacher-excel-semantic-preflight-ui.test.js
