name: Library Circulation Concurrency Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/accounting-service/Code.gs
      - tests/security/accounting-library-circulation-concurrency.test.js
      - .github/workflows/library-circulation-contract.yml

permissions:
  contents: read

jobs:
  library-circulation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
        with:
          ref: NG_beta_0.0.0.1_work
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check ACCOUNTING service
        run: node --check < backend/accounting-service/Code.gs
      - name: Syntax-check library circulation contract
        run: node --check tests/security/accounting-library-circulation-concurrency.test.js
      - name: Run library circulation concurrency/idempotency contract
        run: node tests/security/accounting-library-circulation-concurrency.test.js
