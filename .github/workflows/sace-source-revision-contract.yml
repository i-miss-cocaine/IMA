name: SACE monotonic source revision contracts
on:
  push:
    branches: [NG_beta_0.0.0.1_work]
    paths:
      - 'backend/academic-service/Code.gs'
      - 'backend/user-service/Code.gs'
      - 'backend/exam-service/Code.gs'
      - 'tests/security/sace-source-revision-contract.test.js'
      - '.github/workflows/sace-source-revision-contract.yml'
  pull_request:
    branches: [NG_beta_0.0.0.1_work]
    paths:
      - 'backend/academic-service/Code.gs'
      - 'backend/user-service/Code.gs'
      - 'backend/exam-service/Code.gs'
      - 'tests/security/sace-source-revision-contract.test.js'
      - '.github/workflows/sace-source-revision-contract.yml'
jobs:
  source-revision-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check < backend/academic-service/Code.gs
      - run: node --check < backend/user-service/Code.gs
      - run: node --check < backend/exam-service/Code.gs
      - run: node tests/security/sace-source-revision-contract.test.js
