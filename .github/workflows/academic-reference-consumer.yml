name: Department Reference Consumers Local Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/academic-service/Code.gs
      - backend/accounting-service/Code.gs
      - tests/security/academic-department-reference-consumer.test.js
      - tests/security/accounting-department-reference-consumer.test.js
      - tests/security/departmental-resource-access.test.js
      - .github/workflows/academic-reference-consumer.yml

permissions:
  contents: read
  statuses: write

jobs:
  consumer-contract:
    name: ACADEMIC and ACCOUNTING reference consumer contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
        with:
          ref: NG_beta_0.0.0.1_work
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify checked-out branch and commit
        run: |
          test "$(git branch --show-current)" = "NG_beta_0.0.0.1_work"
          git log -1 --format='%H'
      - name: Run ACADEMIC reference consumer contract
        run: node tests/security/academic-department-reference-consumer.test.js
      - name: Run ACCOUNTING reference consumer contract
        run: node tests/security/accounting-department-reference-consumer.test.js
      - name: Run ACADEMIC departmental resource access regression contract
        run: node tests/security/departmental-resource-access.test.js
      - name: Parse ACADEMIC Apps Script service
        run: node --check < backend/academic-service/Code.gs
      - name: Parse ACCOUNTING Apps Script service
        run: node --check < backend/accounting-service/Code.gs
      - name: Publish isolated result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          (async function () {
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const response = await fetch(process.env.GITHUB_API_URL + "/repos/" + owner + "/" + repo + "/statuses/" + process.env.GITHUB_SHA, {
              method: "POST",
              headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + process.env.GH_TOKEN,
                "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
              body: JSON.stringify({ state, context: "ima/department-reference-consumers", description: state === "success" ? "Both Node contracts and syntax checks passed" : "A consumer contract or syntax check failed" })
            });
            if (!response.ok) throw new Error("Commit status publication failed: HTTP " + response.status);
          })().catch(function (error) { process.stderr.write(error.message + "\n"); process.exitCode = 1; });
          NODE
