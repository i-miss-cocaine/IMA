name: Department Scope Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/user-service/Code.gs
      - backend/academic-service/Code.gs
      - backend/accounting-service/Code.gs
      - backend/task-service/Code.gs
      - backend/exam-service/Code.gs
      - backend/developer-service/Code.gs
      - js/student.js
      - dashboard-recursos-humanos.html
      - js/hr-payroll-pdf.js
      - tests/security/student-payment-voucher-client.test.js
      - tests/security/department-scope-contract.test.js
      - tests/security/internal-responsibility-rbac-contract.test.js
      - tests/security/user-role-membership-contract.test.js
      - login.html
      - js/auth.js
      - tests/security/departmental-resource-access.test.js
      - tests/security/academic-student-expediente-ownership.test.js
      - tests/security/academic-student-enrollment-history-ownership.test.js
      - tests/security/academic-student-enrollment-write-ownership.test.js
      - js/accounting.js
      - dashboard-contabilidad.html
      - tests/security/accounting-enrollment-billing-config.test.js
      - tests/security/accounting-monthly-charge-period.test.js
      - tests/security/academic-enrollment-billing-integration.test.js
      - tests/security/academic-admission-ownership.test.js
      - tests/security/user-service-signature-ownership.test.js
      - tests/security/accounting-departmental-resource-access.test.js
      - tests/security/accounting-vacation-medical-leave-ownership.test.js
      - tests/security/accounting-labor-incident-write-ownership.test.js
      - tests/security/accounting-training-enrollment-ownership.test.js
      - tests/security/accounting-training-course-catalog-ownership.test.js
      - tests/security/accounting-professional-development-analytics-ownership.test.js
      - tests/security/accounting-work-shift-substitution-ownership.test.js
      - tests/security/accounting-departmental-import-scope.test.js
      - tests/security/user-migrated-resource-ownership-contract.test.js
      - tests/security/resource-ownership-abac.test.js
      - tests/security/department-reference-policy.test.js
      - tests/security/department-reference-policy-storage.test.js
      - tests/security/department-reference-grant-admin.test.js
      - tests/security/department-reference-read-authorization.test.js
      - tests/security/department-reference-interservice-envelope.test.js
      - tests/security/academic-department-reference-consumer.test.js
      - tests/security/accounting-department-reference-consumer.test.js
      - .github/workflows/department-scope-contract.yml

permissions:
  contents: read
  statuses: write

jobs:
  department-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run department scope contract
        run: node tests/security/department-scope-contract.test.js
      - name: Run internal responsibility RBAC contract
        run: node tests/security/internal-responsibility-rbac-contract.test.js
      - name: Run accounting departmental import scope contract
        run: node tests/security/accounting-departmental-import-scope.test.js
      - name: Run user migrated resource ownership contract
        run: node tests/security/user-migrated-resource-ownership-contract.test.js
      - name: Run user role membership contract
        run: node tests/security/user-role-membership-contract.test.js
      - name: Run accounting vacation and medical leave ownership contract
        run: node tests/security/accounting-vacation-medical-leave-ownership.test.js
      - name: Run accounting labor incident and disciplinary measure ownership contract
        run: node tests/security/accounting-labor-incident-write-ownership.test.js
      - name: Run accounting training enrollment ownership contract
        run: node tests/security/accounting-training-enrollment-ownership.test.js
      - name: Run accounting training course catalog ownership contract
        run: node tests/security/accounting-training-course-catalog-ownership.test.js
      - name: Run accounting professional development and training analytics ownership contract
        run: node tests/security/accounting-professional-development-analytics-ownership.test.js
      - name: Run accounting work shift and substitution ownership contract
        run: node tests/security/accounting-work-shift-substitution-ownership.test.js
      - name: Run accounting departmental resource access contract
        run: node tests/security/accounting-departmental-resource-access.test.js
      - name: Run academic departmental resource access contract
        run: node tests/security/departmental-resource-access.test.js
      - name: Run academic student expediente ownership contract
        run: node tests/security/academic-student-expediente-ownership.test.js
      - name: Run academic student enrollment history ownership contract
        run: node tests/security/academic-student-enrollment-history-ownership.test.js
      - name: Run academic student enrollment write ownership contract
        run: node tests/security/academic-student-enrollment-write-ownership.test.js
      - name: Run accounting enrollment billing configuration contract
        run: node tests/security/accounting-enrollment-billing-config.test.js
      - name: Run accounting monthly charge period contract
        run: node tests/security/accounting-monthly-charge-period.test.js
      - name: Run academic enrollment billing integration contract
        run: node tests/security/academic-enrollment-billing-integration.test.js
      - name: Run academic admission ownership contract
        run: node tests/security/academic-admission-ownership.test.js
      - name: Run user-service signature ownership contract
        run: node tests/security/user-service-signature-ownership.test.js
      - name: Run generic resource ownership ABAC contract
        run: node tests/security/resource-ownership-abac.test.js
      - name: Run interdepartmental reference policy contract
        run: node tests/security/department-reference-policy.test.js
      - name: Run interdepartmental reference policy storage contract
        run: node tests/security/department-reference-policy-storage.test.js
      - name: Run interdepartmental reference grant administration contract
        run: node tests/security/department-reference-grant-admin.test.js
      - name: Run audited interdepartmental reference read authorization contract
        run: node tests/security/department-reference-read-authorization.test.js
      - name: Run signed interservice reference authorization envelope contract
        run: node tests/security/department-reference-interservice-envelope.test.js
      - name: Run ACADEMIC department reference consumer contract
        run: node tests/security/academic-department-reference-consumer.test.js
      - name: Run ACCOUNTING department reference consumer contract
        run: node tests/security/accounting-department-reference-consumer.test.js
      - name: Syntax-check updated Apps Script services
        run: |
          node --check < backend/user-service/Code.gs
          node --check < backend/academic-service/Code.gs
          node --check < backend/accounting-service/Code.gs
          node --check < backend/task-service/Code.gs
          node --check < backend/exam-service/Code.gs
          node --check < backend/developer-service/Code.gs
      - name: Run student private voucher client contract
        run: node tests/security/student-payment-voucher-client.test.js
      - name: Check student client syntax
        run: node --check js/student.js
      - name: Check authentication client syntax
        run: node --check js/auth.js
      - name: Check HR payroll PDF download helper
        run: node --check js/hr-payroll-pdf.js
      - name: Publish Department Scope result for API verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          (async function () {
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const response = await fetch(
              process.env.GITHUB_API_URL + "/repos/" + owner + "/" + repo + "/statuses/" + process.env.GITHUB_SHA,
              {
                method: "POST",
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + process.env.GH_TOKEN,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  state: state,
                  context: "ima/department-scope-contract",
                  description: state === "success" ? "Node contracts and syntax checks passed" : "A Node contract or syntax check failed"
                })
              }
            );
            if (!response.ok) throw new Error("Commit status publication failed: HTTP " + response.status);
            process.stdout.write("Published " + state + " status for " + process.env.GITHUB_SHA + "\\n");
          })().catch(function (error) { process.stderr.write(error.message + "\\n"); process.exitCode = 1; });
          NODE
