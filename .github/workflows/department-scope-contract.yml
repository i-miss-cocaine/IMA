name: Department Scope Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/user-service/Code.gs
      - backend/academic-service/Code.gs
      - backend/accounting-service/Code.gs
      - js/student.js
      - tests/security/student-payment-voucher-client.test.js
      - tests/security/department-scope-contract.test.js
      - tests/security/departmental-resource-access.test.js
      - tests/security/accounting-departmental-resource-access.test.js
      - .github/workflows/department-scope-contract.yml

permissions:
  contents: read

jobs:
  department-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run department scope contract
        run: node tests/security/department-scope-contract.test.js
      - name: Run academic departmental resource access contract
        run: node tests/security/departmental-resource-access.test.js
      - name: Run accounting departmental resource access contract
        run: node tests/security/accounting-departmental-resource-access.test.js
      - name: Run student private voucher client contract
        run: node tests/security/student-payment-voucher-client.test.js
      - name: Check student client syntax
        run: node --check js/student.js
