name: Developer Service Registry Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/developer-service/Code.gs
      - tests/security/developer-service-registry.test.js
      - tests/security/developer-console-role-boundary.test.js
      - js/developer.js
      - developer-dashboard.html
      - .github/workflows/developer-service-registry-contract.yml

permissions:
  contents: read

jobs:
  developer-service-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
        with:
          ref: NG_beta_0.0.0.1_work
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check DEVELOPER service
        run: node --check < backend/developer-service/Code.gs
      - name: Syntax-check registry contract
        run: node --check tests/security/developer-service-registry.test.js
      - name: Syntax-check developer console
        run: node --check js/developer.js
      - name: Syntax-check console role boundary contract
        run: node --check tests/security/developer-console-role-boundary.test.js
      - name: Run registry contract
        run: node tests/security/developer-service-registry.test.js
      - name: Run console role boundary contract
        run: node tests/security/developer-console-role-boundary.test.js
