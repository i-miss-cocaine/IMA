name: Task-Service backup and restore contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - "backend/task-service/Code.gs"
      - "tests/security/task-service-backup-restore-contract.test.js"
      - ".github/workflows/task-service-backup-restore-contract.yml"

permissions:
  contents: read

jobs:
  backup-restore-contract:
    name: Run Node static contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Execute backup and restore contract
        run: node tests/security/task-service-backup-restore-contract.test.js
