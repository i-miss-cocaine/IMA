name: Hierarchical Configuration Contract

on:
  push:
    branches:
      - NG_beta_0.0.0.1_work
    paths:
      - backend/user-service/Code.gs
      - backend/developer-service/Code.gs
      - backend/academic-service/Code.gs
      - backend/accounting-service/Code.gs
      - js/ui-common.js
      - tests/security/user-service-hierarchical-configuration.test.js
      - tests/security/hierarchical-configuration-consumer-integration.test.js
      - .github/workflows/hierarchical-configuration-contract.yml

permissions:
  contents: read

jobs:
  hierarchical-configuration-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized work branch
        uses: actions/checkout@v4
        with:
          ref: NG_beta_0.0.0.1_work
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check USER service
        run: node --check < backend/user-service/Code.gs
      - name: Syntax-check DEVELOPER service
        run: node --check < backend/developer-service/Code.gs
      - name: Syntax-check ACADEMIC service
        run: node --check < backend/academic-service/Code.gs
      - name: Syntax-check ACCOUNTING service
        run: node --check < backend/accounting-service/Code.gs
      - name: Syntax-check UI common module
        run: node --check js/ui-common.js
      - name: Syntax-check contract
        run: node --check tests/security/user-service-hierarchical-configuration.test.js
      - name: Syntax-check hierarchical UI contract
        run: node --check tests/security/hierarchical-configuration-ui.test.js
      - name: Syntax-check consumer integration contract
        run: node --check tests/security/hierarchical-configuration-consumer-integration.test.js
      - name: Run hierarchical configuration contract
        run: node tests/security/user-service-hierarchical-configuration.test.js
      - name: Run hierarchical configuration UI contract
        run: node tests/security/hierarchical-configuration-ui.test.js
      - name: Run consumer integration contract
        run: node tests/security/hierarchical-configuration-consumer-integration.test.js
