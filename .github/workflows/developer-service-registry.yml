name: Developer Service Registry Contract
on:
  push:
    branches: [NG_beta_0.0.0.1_work]
    paths:
      - "backend/user-service/Code.gs"
      - "backend/academic-service/Code.gs"
      - "backend/accounting-service/Code.gs"
      - "backend/task-service/Code.gs"
      - "backend/exam-service/Code.gs"
      - "backend/developer-service/Code.gs"
      - "js/api.js"
      - "js/ui-common.js"
      - "developer-dashboard.html"
      - "js/developer.js"
      - "tests/contracts/**"
      - ".github/workflows/developer-service-registry.yml"
      - ".github/workflows/ima-local-verification-export.yml"
  pull_request:
    branches: [NG_beta_0.0.0.1_work]
    paths:
      - "backend/developer-service/Code.gs"
      - "js/api.js"
      - "js/ui-common.js"
      - "developer-dashboard.html"
      - "js/developer.js"
      - "tests/contracts/developer-service-registry.contract.test.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git diff --check HEAD^ HEAD
      - run: node --check < backend/user-service/Code.gs
      - run: node --check < backend/academic-service/Code.gs
      - run: node --check < backend/accounting-service/Code.gs
      - run: node --check < backend/task-service/Code.gs
      - run: node --check < backend/exam-service/Code.gs
      - run: node --check < backend/developer-service/Code.gs
      - run: node --check < js/api.js
      - run: node --check < js/ui-common.js
      - run: node --check < js/developer.js
      - run: node --test tests/contracts/*.test.js
      - name: Export exact repository snapshot for local verification
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/ima-source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ima-local-verification-${{ github.sha }}
          path: /tmp/ima-source-snapshot.tar.gz
          retention-days: 1
